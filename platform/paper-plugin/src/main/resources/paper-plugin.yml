name: PlayerNotifications
version: "${version}"
main: io.github.md5sha256.playernotifications.paper.PlayerNotificationsPlugin
api-version: "26.1"
authors: [ md5sha256 ]
description: Player notifications plugin.

# Paper plugins are classloader-isolated by default. The Discord adapter module's class loader is
# parent-first onto this plugin's, so DiscordSRV's classes must be visible from here or
# DiscordSrvAccountProvider silently reports itself unavailable. Soft: DiscordSRV is optional, and
# only the discord-adapter module ever touches it.
dependencies:
  server:
    DiscordSRV:
      load: BEFORE
      required: false
      join-classpath: true
    # Same shape, for the essentials-mail-converter module: its EssentialsMailBinding names
    # com.earth2me.essentials types, and a feature module's URLClassLoader is parent-first onto this
    # plugin's loader, so without join-classpath those classes are unreachable and the binding dies with
    # NoClassDefFoundError even on a server where EssentialsX is installed and enabled. This module is a
    # one-shot migration tool, so the entry can be deleted once every server has converted.
    Essentials:
      load: BEFORE
      required: false
      join-classpath: true
    # For /broadcast --offline: LuckPermsPermissionLookup names net.luckperms types and is the only
    # way to answer a permission check for a player who is not online. Same isolation shape as the two
    # above, and the same caveat — an *unloaded* LuckPerms jar left in plugins/ can poison class
    # loading here, so remove the jar rather than leaving it disabled.
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  playernotifications.command.preferences:
    description: Open the notification preferences dialog with /notifications preferences.
    default: true
  # Separable from the preferences grant: linking a Minecraft account to an external one is a
  # different decision from choosing delivery media. Additive, not a replacement — the command root
  # still requires playernotifications.command.preferences, so revoking that hides linking too.
  playernotifications.command.link:
    description: Link and unlink external accounts with /notifications link|unlink.
    default: true
  playernotifications.command.reload:
    description: Reload categories.yml and settings.yml with /notifications reload.
    default: op
  playernotifications.command.test:
    description: Send yourself a test notification with /notifications test.
    default: op
  # A broadcast reaches every online player matching the given permissions (or all of them) and is
  # never stored - see the "Broadcast" section of CLAUDE.md.
  playernotifications.command.broadcast:
    description: Broadcast a message to online players with /broadcast.
    default: op
  # /notifications send writes into another player's inbox, so it sits with /broadcast rather than
  # with the default: true player-facing subcommands.
  playernotifications.command.send:
    description: Send a notification to one player with /notifications send.
    default: op
  playernotifications.command.mail:
    description: Read your mail with /mail.
    default: true
  # Additive on top of playernotifications.command.mail: a server can make mail read-only for a rank
  # without hiding the inbox. Brigadier requires nest, so revoking the root above hides send too.
  playernotifications.command.mail.send:
    description: Send mail with /mail send.
    default: true
  # One node per MiniMessage tag group in /mail send. All of them are op: a formatted mail is
  # something an operator opts a rank into, cosmetic tags included. The split is fine-grained so a
  # server can grant exactly the cosmetic groups (color, decoration, gradient, rainbow, reset,
  # newline) without also handing out click and hover events, which attach a runnable command or a
  # payload to text landing in someone else's inbox, or score/nbt, which pull server-side state in.
  # A tag the sender may not use is left as literal text rather than stripped, and permissions are
  # evaluated once, at send time - see MailFormatting.
  playernotifications.command.mail.format.color:
    description: Use colour and shadow-colour tags in /mail send.
    default: op
  playernotifications.command.mail.format.decoration:
    description: Use bold, italic, underlined, strikethrough and obfuscated tags in /mail send.
    default: op
  playernotifications.command.mail.format.gradient:
    description: Use gradient, transition and pride tags in /mail send.
    default: op
  playernotifications.command.mail.format.rainbow:
    description: Use the rainbow tag in /mail send.
    default: op
  playernotifications.command.mail.format.reset:
    description: Use the reset tag in /mail send.
    default: op
  playernotifications.command.mail.format.newline:
    description: Use the newline tag in /mail send.
    default: op
  playernotifications.command.mail.format.font:
    description: Use the font tag in /mail send.
    default: op
  playernotifications.command.mail.format.click:
    description: Use click events in /mail send.
    default: op
  playernotifications.command.mail.format.hover:
    description: Use hover events in /mail send.
    default: op
  playernotifications.command.mail.format.insertion:
    description: Use the insertion tag in /mail send.
    default: op
  playernotifications.command.mail.format.keybind:
    description: Use the keybind tag in /mail send.
    default: op
  playernotifications.command.mail.format.translatable:
    description: Use translatable text and its fallback in /mail send.
    default: op
  playernotifications.command.mail.format.selector:
    description: Use the selector tag in /mail send.
    default: op
  playernotifications.command.mail.format.score:
    description: Use the score tag in /mail send.
    default: op
  playernotifications.command.mail.format.nbt:
    description: Use the nbt tag in /mail send.
    default: op
