# PlayerNotifications — Discord adapter
#
# This module delivers notifications as Discord direct messages, under the medium key
# "discord-dm". Once it is running, "Discord DM" appears automatically in /notifications.

# The bot token for THIS module's own Discord bot.
#
# It cannot share DiscordSRV's bot: DiscordSRV relocates its bundled JDA, so its connection is not
# usable from here. Create a bot at https://discord.com/developers/applications, invite it to a
# guild the players are in (Discord refuses a DM between a bot and a user with no shared guild),
# and paste its token below.
#
# The module refuses to start while this is empty, rather than registering a medium that can never
# deliver.
bot-token: ""

# How a notification is rendered:
#   embed    — an embed with a plain-text title and a markdown body (default)
#   markdown — a single message: a bold title line, then the body
#   plain    — a single message with no markdown at all
# An unrecognised value falls back to "embed".
message-format: embed

# The embed's accent colour, used when a notification's title carries no colour of its own.
# Accepts "#RRGGBB" or "RRGGBB"; anything unparseable falls back to Discord's blurple.
embed-color: "#5865F2"

# How long a single DM send may block before it counts as a transient failure. The notification is
# retained and retried on the next delivery pass.
delivery-timeout-seconds: 15

# The account-link sources consulted, in order, to turn a player's UUID into a Discord user id.
# The first source with a link wins; an unknown key is warned about and skipped. If none of the listed
# sources is available, a warning is logged at startup — otherwise every Discord DM would silently come
# back as undeliverable.
#
# Shipped keys:
#   embedded   — this plugin's own link table, populated in game with /notifications link discord. Needs no other
#                plugin, and is what lets you run the Discord adapter with DiscordSRV absent.
#   discordsrv — legacy DiscordSRV 2.x's account link manager. Optional: if DiscordSRV is not
#                installed, this source reports itself unavailable and is skipped.
#
# Listing both, as below, is the right setting for a server moving off DiscordSRV: new links land in the
# embedded table and win, while players who only have an old DiscordSRV link keep working.
#
# /notifications link discord and the bot's /link slash command are only registered when "embedded" is listed, so a
# DiscordSRV-only server gets no command it cannot use.
link-providers:
  - embedded
  - discordsrv

# How long a code issued by /notifications link discord stays redeemable, in seconds.
#
# Codes are held in memory and do not survive a restart — a code's whole purpose is to be transient, and
# a player who loses one simply runs /notifications link discord again.
link-code-expiry-seconds: 600

# Whether the bot registers the /mail and /notifications slash commands, letting a linked player read
# and send mail and manage their notifications from Discord.
#
# Setting this to false leaves /link registered — a server that wants Discord as a delivery medium only
# still needs players to be able to link their account.
commands-enabled: true
