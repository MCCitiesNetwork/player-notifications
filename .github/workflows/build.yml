name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach jars to (e.g. v1.5.0). Leave empty to build the selected branch.
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # A release builds its own tag; a manual run with a tag builds that tag.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      # Must equal the Gradle toolchain version in the conventions plugin.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Collect JARs
        run: |
          mkdir -p jars
          find . -path "*/build/libs/*.jar" -type f \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "*-tests.jar" \
            ! -name "*-plain.jar" \
            ! -name "*-unshaded.jar" \
            -exec cp {} jars/ \;

      - name: Upload JARs
        uses: actions/upload-artifact@v6
        with:
          name: jars-${{ github.sha }}
          path: jars/*.jar
          if-no-files-found: error
          retention-days: 14

  # Only this job may write to the repository, and only to attach release assets.
  attach:
    needs: build
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download JARs
        uses: actions/download-artifact@v7
        with:
          name: jars-${{ github.sha }}
          path: jars

      - name: Attach JARs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" jars/*.jar --clobber --repo "$GITHUB_REPOSITORY"
